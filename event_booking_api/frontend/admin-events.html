<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Events - Event Booking System</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-container">

            <h2 class="logo">
                Event Booking System
            </h2>

            <div class="nav-links">

                <a href="admin-dashboard.html">
                    Dashboard
                </a>

                <a href="admin-events.html">
                    Events
                </a>

                <button
                    id="logoutBtn"
                    class="logout-btn"
                >
                    Logout
                </button>

            </div>
        </div>
    </nav>


    <!-- MAIN CONTENT -->
    <main class="main-container">

        <!-- PAGE HEADER -->
        <div class="page-header">

            <div>
                <h1>Event Management</h1>
                <p>Create, update and manage events.</p>
            </div>

            <div
                id="userInfo"
                class="user-info"
            ></div>

        </div>


        <!-- ADD EVENT BUTTON -->
        <div class="admin-action-bar">

            <button
                id="addEventBtn"
                class="primary-btn"
            >
                + Add New Event
            </button>

        </div>


        <!-- MESSAGE -->
        <div id="message"></div>


        <!-- EVENT FORM -->
        <div
            id="eventFormContainer"
            class="admin-form-card"
            style="display: none;"
        >

            <div class="form-header">

                <h2 id="formTitle">
                    Add New Event
                </h2>

                <button
                    type="button"
                    id="closeFormBtn"
                    class="close-btn"
                >
                    ×
                </button>

            </div>


            <form id="eventForm">

                <input
                    type="hidden"
                    id="eventId"
                >


                <!-- EVENT NAME -->
                <div class="form-group">

                    <label for="eventName">
                        Event Name
                    </label>

                    <input
                        type="text"
                        id="eventName"
                        placeholder="Enter event name"
                        required
                    >

                </div>


                <!-- DESCRIPTION -->
                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        rows="4"
                        placeholder="Enter event description"
                        required
                    ></textarea>

                </div>


                <!-- DATE + TIME -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="eventDate">
                            Event Date
                        </label>

                        <input
                            type="date"
                            id="eventDate"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="eventTime">
                            Event Time
                        </label>

                        <input
                            type="time"
                            id="eventTime"
                            required
                        >

                    </div>

                </div>


                <!-- PRICE + TICKETS -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="ticketPrice">
                            Ticket Price (RM)
                        </label>

                        <input
                            type="number"
                            id="ticketPrice"
                            min="0"
                            step="0.01"
                            placeholder="0.00"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="totalTickets">
                            Total Tickets
                        </label>

                        <input
                            type="number"
                            id="totalTickets"
                            min="1"
                            placeholder="100"
                            required
                        >

                    </div>

                </div>


                <!-- VENUE + ORGANISER -->
                <div class="form-row">

                    <div class="form-group">

                        <label for="venueId">
                            Venue ID
                        </label>

                        <input
                            type="number"
                            id="venueId"
                            min="1"
                            placeholder="Enter venue ID"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="organiserId">
                            Organiser ID
                        </label>

                        <input
                            type="number"
                            id="organiserId"
                            min="1"
                            placeholder="Enter organiser ID"
                            required
                        >

                    </div>

                </div>


                <!-- STATUS -->
                <div class="form-group">

                    <label for="status">
                        Status
                    </label>

                    <select
                        id="status"
                        required
                    >

                        <option value="upcoming">
                            Upcoming
                        </option>

                        <option value="completed">
                            Completed
                        </option>

                        <option value="cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>


                <!-- BUTTONS -->
                <div class="form-buttons">

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        Save Event
                    </button>

                    <button
                        type="button"
                        id="cancelFormBtn"
                        class="secondary-btn"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </div>


        <!-- EVENTS SECTION -->
        <section class="admin-section">

            <div class="section-header">

                <h2>
                    All Events
                </h2>

            </div>


            <div
                id="loading"
                class="loading"
            >
                Loading events...
            </div>


            <div
                id="eventsContainer"
                class="admin-events-grid"
            ></div>

        </section>

    </main>


    <!-- ========================================== -->
    <!-- AUTHENTICATION / ADMIN PROTECTION -->
    <!-- ========================================== -->

    <script src="auth.js"></script>

    <script>
        requireRole("admin");
    </script>


    <!-- ========================================== -->
    <!-- ADMIN EVENT SCRIPT -->
    <!-- ========================================== -->

    <script src="admin-events.js"></script>


</body>

</html>
